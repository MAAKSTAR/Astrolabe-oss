name: Cleanup Old Actions Artifacts

on:
  workflow_dispatch:
    inputs:
      keep_recent:
        description: 'Number of most recent artifacts to keep (0 deletes all)'
        required: true
        default: '0'

permissions:
  actions: write

jobs:
  cleanup-artifacts:
    name: Purge Old Workflow Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Actions Artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const keepRecent = Math.max(0, parseInt('${{ inputs.keep_recent }}', 10) || 0);
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 }
            );
            artifacts.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = artifacts.slice(keepRecent);
            core.info(`Found ${artifacts.length} total artifacts; deleting ${toDelete.length} (keeping ${keepRecent}).`);
            let deletedBytes = 0;
            for (const artifact of toDelete) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                deletedBytes += artifact.size_in_bytes || 0;
              } catch (err) {
                core.warning(`Failed deleting artifact ${artifact.id} (${artifact.name}): ${err.message}`);
              }
            }
            core.info(`Freed ${(deletedBytes / (1024 * 1024)).toFixed(1)} MB across ${toDelete.length} artifacts.`);
