name: Astrolabe Release Build (Linux & Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. LINUX BUILD (Ubuntu / Debian / tar.gz)
  # ============================================================================
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install LunarG Vulkan SDK & Build Tools
        run: |
          sudo apt-get update
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk cmake build-essential pkg-config libssl-dev libx11-dev libxkbfile-dev libsecret-1-dev
          which glslc || true

      - name: Build Native AI Daemon (Rust / Vulkan)
        run: |
          cd daemon
          cargo build --release
          strip target/release/exovon-daemon || true

      - name: Build Exovon SDK
        run: |
          cd packages/exovon-sdk
          npm install --no-audit --no-fund
          npm run build

      - name: Build Astrolabe Motion Studio
        run: |
          cd apps/astrolabe-motion-studio
          npm install --no-audit --no-fund
          npm run build

      - name: Build ExovonHub Webview & Extension
        run: |
          cd src/stable/extensions/exovonhub/webview-ui
          npm install --no-audit --no-fund
          cd ..
          npm install --ignore-scripts --no-audit --no-fund
          npm run compile

      - name: Package Complete Standalone Linux Distribution
        run: |
          mkdir -p dist-linux/astrolabe
          echo "==> Fetching base Electron IDE..."
          LATEST_CODIUM=$(curl -sL "https://api.github.com/repos/VSCodium/vscodium/releases/latest" | grep -o 'https://github.com/VSCodium/vscodium/releases/download/[^"]*VSCodium-linux-x64-[^"]*\.tar\.gz' | head -n 1)
          curl -L "$LATEST_CODIUM" -o /tmp/codium-linux.tar.gz
          tar -xzf /tmp/codium-linux.tar.gz -C dist-linux/astrolabe
          
          # Brand executable as astrolabe
          if [ -f "dist-linux/astrolabe/codium" ]; then
            mv dist-linux/astrolabe/codium dist-linux/astrolabe/astrolabe
          fi
          if [ -f "dist-linux/astrolabe/bin/codium" ]; then
            mv dist-linux/astrolabe/bin/codium dist-linux/astrolabe/bin/astrolabe
          fi
          
          # Inject native AI daemon (Rust + Vulkan)
          cp daemon/target/release/exovon-daemon dist-linux/astrolabe/
          mkdir -p dist-linux/astrolabe/resources/app/daemon
          cp daemon/target/release/exovon-daemon dist-linux/astrolabe/resources/app/daemon/
          
          # Inject compiled ExovonHub extension
          mkdir -p dist-linux/astrolabe/resources/app/extensions/exovonhub
          cp -r src/stable/extensions/exovonhub/package.json dist-linux/astrolabe/resources/app/extensions/exovonhub/
          cp -r src/stable/extensions/exovonhub/dist dist-linux/astrolabe/resources/app/extensions/exovonhub/
          if [ -d "src/stable/extensions/exovonhub/media" ]; then
            cp -r src/stable/extensions/exovonhub/media dist-linux/astrolabe/resources/app/extensions/exovonhub/
          fi
          
          # Inject Motion Studio & icons
          cp -r apps/astrolabe-motion-studio dist-linux/astrolabe/
          cp -r icons dist-linux/astrolabe/
          cp icons/stable/astrolabe.png dist-linux/astrolabe/astrolabe.png
          cp README.md LICENSE build-all-astrolabe.sh install.sh dist-linux/astrolabe/
          
          # Create clean 130MB archive
          cd dist-linux
          tar -czf ../astrolabe-linux-x64.tar.gz astrolabe

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-linux-x64
          path: astrolabe-linux-x64.tar.gz

  # ============================================================================
  # 2. WINDOWS BUILD (Windows x64 zip / exe)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Vulkan SDK (Windows)
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanDir = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($vulkanDir) {
            echo "VULKAN_SDK=$($vulkanDir.FullName)" >> $env:GITHUB_ENV
            echo "$($vulkanDir.FullName)\Bin" >> $env:GITHUB_PATH
          }
        shell: powershell

      - name: Build Native AI Daemon (Windows MSVC)
        run: |
          cd daemon
          cargo build --release
        shell: bash

      - name: Build Exovon SDK
        run: |
          cd packages/exovon-sdk
          npm install --no-audit --no-fund
          npm run build
        shell: bash

      - name: Build Astrolabe Motion Studio
        run: |
          cd apps/astrolabe-motion-studio
          npm install --no-audit --no-fund
          npm run build
        shell: bash

      - name: Build ExovonHub Webview & Extension
        run: |
          cd src/stable/extensions/exovonhub/webview-ui
          npm install --no-audit --no-fund
          cd ..
          npm install --ignore-scripts --no-audit --no-fund
          npm run compile
        shell: bash

      - name: Package Complete Windows Distribution
        run: |
          New-Item -ItemType Directory -Path "dist-win\astrolabe" -Force | Out-Null
          Write-Host "==> Fetching base Windows Electron IDE..."
          $LATEST_CODIUM = (Invoke-RestMethod -Uri "https://api.github.com/repos/VSCodium/vscodium/releases/latest").assets | Where-Object { $_.name -like "VSCodium-win32-x64-*.zip" } | Select-Object -First 1 -ExpandProperty browser_download_url
          Invoke-WebRequest -Uri $LATEST_CODIUM -OutFile "$env:TEMP\codium-win.zip"
          Expand-Archive -Path "$env:TEMP\codium-win.zip" -DestinationPath "dist-win\astrolabe" -Force
          
          if (Test-Path "dist-win\astrolabe\VSCodium.exe") {
            Move-Item "dist-win\astrolabe\VSCodium.exe" "dist-win\astrolabe\astrolabe.exe" -Force
          }
          if (Test-Path "dist-win\astrolabe\bin\codium.cmd") {
            Move-Item "dist-win\astrolabe\bin\codium.cmd" "dist-win\astrolabe\bin\astrolabe.cmd" -Force
          }
          
          # Inject native AI daemon (Windows)
          Copy-Item "daemon\target\release\exovon-daemon.exe" "dist-win\astrolabe\" -Force
          New-Item -ItemType Directory -Path "dist-win\astrolabe\resources\app\daemon" -Force | Out-Null
          Copy-Item "daemon\target\release\exovon-daemon.exe" "dist-win\astrolabe\resources\app\daemon\" -Force
          
          # Inject compiled ExovonHub extension
          New-Item -ItemType Directory -Path "dist-win\astrolabe\resources\app\extensions\exovonhub" -Force | Out-Null
          Copy-Item "src\stable\extensions\exovonhub\package.json" "dist-win\astrolabe\resources\app\extensions\exovonhub\" -Force
          Copy-Item -Recurse "src\stable\extensions\exovonhub\dist" "dist-win\astrolabe\resources\app\extensions\exovonhub\" -Force
          if (Test-Path "src\stable\extensions\exovonhub\media") {
            Copy-Item -Recurse "src\stable\extensions\exovonhub\media" "dist-win\astrolabe\resources\app\extensions\exovonhub\" -Force
          }
          
          # Inject Motion Studio & icons & docs
          Copy-Item -Recurse "apps\astrolabe-motion-studio" "dist-win\astrolabe\" -Force
          Copy-Item -Recurse "icons" "dist-win\astrolabe\" -Force
          Copy-Item "icons\stable\astrolabe.png" "dist-win\astrolabe\astrolabe.png" -Force
          Copy-Item "README.md", "LICENSE" "dist-win\astrolabe\" -Force
          
          # Create real clean Windows zip archive
          Compress-Archive -Path "dist-win\astrolabe\*" -DestinationPath "astrolabe-windows-x64.zip" -Force
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-windows-x64
          path: astrolabe-windows-x64.zip

  # ============================================================================
  # 3. PUBLISH GITHUB RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release Packages
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Astrolabe ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            # 🚀 Astrolabe All-In-One Open Source Release

            ### Standalone Distribution Downloads:
            * **🐧 Linux (Ubuntu / Debian / Arch / CachyOS x64)**: `astrolabe-linux-x64.tar.gz`
            * **🪟 Windows (x64 Standalone Zip)**: `astrolabe-windows-x64.zip`

            ---
            * **Native AI Engine**: Embedded Rust daemon with Vulkan, SGLang, and CPU fallback.
            * **Motion Studio**: Visual UI and timeline animation studio.
            * **ExovonHub Agent**: Autonomous multi-file AI coding assistant and local model hub.
            * **Machine HealthGuard**: Built-in thermal monitoring and OOM hardware protection.
          files: |
            astrolabe-linux-x64/astrolabe-linux-x64.tar.gz
            astrolabe-windows-x64/astrolabe-windows-x64.zip
