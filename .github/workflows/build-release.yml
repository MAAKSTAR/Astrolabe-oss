name: Astrolabe Release Build (Linux & Windows)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ============================================================================
  # 1. LINUX BUILD (Ubuntu / Debian / tar.gz)
  # ============================================================================
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install LunarG Vulkan SDK & Build Tools
        run: |
          sudo apt-get update
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk cmake build-essential pkg-config libssl-dev libx11-dev libxkbfile-dev libsecret-1-dev
          which glslc || true

      - name: Build Native AI Daemon (Rust / Vulkan)
        run: |
          cd daemon
          cargo build --release
          strip target/release/exovon-daemon || true

      - name: Build Exovon SDK
        run: |
          cd packages/exovon-sdk
          npm install --no-audit --no-fund
          npm run build

      - name: Build Astrolabe Motion Studio
        run: |
          cd apps/astrolabe-motion-studio
          npm install --no-audit --no-fund
          npm run build

      - name: Build ExovonHub Webview & Extension
        run: |
          cd src/stable/extensions/exovonhub/webview-ui
          npm install --no-audit --no-fund
          npm run build
          cd ..
          npm install --ignore-scripts --no-audit --no-fund
          npm run compile

      - name: Package Complete Standalone Linux Distribution
        run: |
          mkdir -p dist-linux/astrolabe
          echo "==> Fetching base Electron IDE..."
          LATEST_CODIUM=$(curl -sL "https://api.github.com/repos/VSCodium/vscodium/releases/latest" | grep -o 'https://github.com/VSCodium/vscodium/releases/download/[^"]*VSCodium-linux-x64-[^"]*\.tar\.gz' | head -n 1)
          curl -L "$LATEST_CODIUM" -o /tmp/codium-linux.tar.gz
          tar -xzf /tmp/codium-linux.tar.gz -C dist-linux/astrolabe
          
          # Brand executable as astrolabe
          if [ -f "dist-linux/astrolabe/codium" ]; then
            mv dist-linux/astrolabe/codium dist-linux/astrolabe/astrolabe
          fi
          if [ -f "dist-linux/astrolabe/bin/codium" ]; then
            mv dist-linux/astrolabe/bin/codium dist-linux/astrolabe/bin/astrolabe
          fi
          
          # Inject native AI daemon (Rust + Vulkan) & all shared libraries
          mkdir -p dist-linux/astrolabe/daemon dist-linux/astrolabe/resources/app/daemon
          cp daemon/target/release/exovon-daemon dist-linux/astrolabe/daemon/
          cp daemon/target/release/exovon-daemon dist-linux/astrolabe/resources/app/daemon/
          cp -d daemon/target/release/deps/libllama*.so* dist-linux/astrolabe/daemon/ 2>/dev/null || true
          cp -d daemon/target/release/deps/libggml*.so* dist-linux/astrolabe/daemon/ 2>/dev/null || true
          cp -d daemon/target/release/deps/libmtmd*.so* dist-linux/astrolabe/daemon/ 2>/dev/null || true
          cp -d daemon/target/release/deps/libllama*.so* dist-linux/astrolabe/resources/app/daemon/ 2>/dev/null || true
          cp -d daemon/target/release/deps/libggml*.so* dist-linux/astrolabe/resources/app/daemon/ 2>/dev/null || true
          cp -d daemon/target/release/deps/libmtmd*.so* dist-linux/astrolabe/resources/app/daemon/ 2>/dev/null || true
          find daemon/target -name "libllama*.so*" -exec cp -d {} dist-linux/astrolabe/daemon/ \; 2>/dev/null || true
          find daemon/target -name "libggml*.so*" -exec cp -d {} dist-linux/astrolabe/daemon/ \; 2>/dev/null || true
          find daemon/target -name "libmtmd*.so*" -exec cp -d {} dist-linux/astrolabe/daemon/ \; 2>/dev/null || true
          find daemon/target -name "libllama*.so*" -exec cp -d {} dist-linux/astrolabe/resources/app/daemon/ \; 2>/dev/null || true
          find daemon/target -name "libggml*.so*" -exec cp -d {} dist-linux/astrolabe/resources/app/daemon/ \; 2>/dev/null || true
          find daemon/target -name "libmtmd*.so*" -exec cp -d {} dist-linux/astrolabe/resources/app/daemon/ \; 2>/dev/null || true

          # Inject Astrolabe product branding & identity
          cp product.json dist-linux/astrolabe/resources/app/product.json
          
          # Brand resources/app/package.json name as astrolabe
          sed -i '0,/"name": "VSCodium"/{s/"name": "VSCodium"/"name": "astrolabe"/}' dist-linux/astrolabe/resources/app/package.json
          
          # Clean node_modules symlinks
          rm -rf src/stable/extensions/exovonhub/node_modules/.bin
          rm -rf src/stable/extensions/exovonhub/node_modules/@exovon
          mkdir -p src/stable/extensions/exovonhub/node_modules/@exovon
          cp -r packages/exovon-sdk src/stable/extensions/exovonhub/node_modules/@exovon/sdk
          cp -r packages/exovon-core src/stable/extensions/exovonhub/node_modules/@exovon/core 2>/dev/null || true
          rm -rf src/stable/extensions/exovonhub/node_modules/@exovon/sdk/node_modules/.bin 2>/dev/null || true
          
          # Inject compiled ExovonHub extension (code + webview-ui + themes + media + node_modules)
          mkdir -p dist-linux/astrolabe/resources/app/extensions/exovonhub/webview-ui
          cp -r src/stable/extensions/exovonhub/package.json dist-linux/astrolabe/resources/app/extensions/exovonhub/
          cp -r src/stable/extensions/exovonhub/dist dist-linux/astrolabe/resources/app/extensions/exovonhub/
          cp -r src/stable/extensions/exovonhub/webview-ui/dist dist-linux/astrolabe/resources/app/extensions/exovonhub/webview-ui/
          cp -r src/stable/extensions/exovonhub/node_modules dist-linux/astrolabe/resources/app/extensions/exovonhub/
          if [ -d "src/stable/extensions/exovonhub/themes" ]; then
            cp -r src/stable/extensions/exovonhub/themes dist-linux/astrolabe/resources/app/extensions/exovonhub/
          fi
          if [ -d "src/stable/extensions/exovonhub/media" ]; then
            cp -r src/stable/extensions/exovonhub/media dist-linux/astrolabe/resources/app/extensions/exovonhub/
          fi
          
          # Inject Motion Studio & icons
          cp -r apps/astrolabe-motion-studio dist-linux/astrolabe/
          cp -r icons dist-linux/astrolabe/
          cp icons/stable/astrolabe.png dist-linux/astrolabe/astrolabe.png
          mkdir -p dist-linux/astrolabe/resources/linux dist-linux/astrolabe/resources/app/resources/linux
          cp -f icons/stable/astrolabe.png dist-linux/astrolabe/resources/linux/code.png 2>/dev/null || true
          cp -f icons/stable/astrolabe.png dist-linux/astrolabe/resources/app/resources/linux/code.png 2>/dev/null || true
          
          # Inject Astrolabe SVG icons & empty-screen watermarks into workbench
          python3 -c "
          import base64, os
          with open('icons/stable/astrolabe.png', 'rb') as f:
              b64 = base64.b64encode(f.read()).decode('ascii')
          icon_svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">
            <image width=\"100\" height=\"100\" xlink:href=\"data:image/png;base64,{b64}\"/>
          </svg>'''
          watermark_svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" opacity=\"0.2\">
            <image width=\"200\" height=\"200\" xlink:href=\"data:image/png;base64,{b64}\"/>
          </svg>'''
          media_dir = 'dist-linux/astrolabe/resources/app/out/media'
          if os.path.exists(media_dir):
              for name in ['code-icon.svg', 'vscode-icon.svg']:
                  with open(os.path.join(media_dir, name), 'w') as f:
                      f.write(icon_svg)
              for name in ['letterpress-dark.svg', 'letterpress-light.svg', 'letterpress-hcDark.svg', 'letterpress-hcLight.svg']:
                  with open(os.path.join(media_dir, name), 'w') as f:
                      f.write(watermark_svg)
          "

          # Inject Astrolabe Glass UI into workbench CSS
          if [ -f "dist-linux/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.css" ]; then
            cat src/stable/src/vs/workbench/browser/media/astrolabe-glass.css >> dist-linux/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.css
            echo "✓ Injected Astrolabe Frosted Glass UI into Linux workbench CSS"
          fi
          
          # Brand desktopName and Walkthrough/Announcements text
          sed -i 's/"desktopName":"codium.desktop"/"desktopName":"astrolabe.desktop"/g' dist-linux/astrolabe/resources/app/out/main.js 2>/dev/null || true
          if [ -f "dist-linux/astrolabe/resources/app/out/nls.messages.json" ]; then
            sed -i 's/Get started with VSCodium/Get started with Astrolabe/g' dist-linux/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/VSCodium Announcements/Astrolabe Announcements/g' dist-linux/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/reloading VSCodium/reloading Astrolabe/g' dist-linux/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/Customize your editor, learn the basics, and start coding/Customize your AI workspace, explore agents, and start coding/g' dist-linux/astrolabe/resources/app/out/nls.messages.json
          fi
          sed -i 's/Get started with VSCodium/Get started with Astrolabe/g' dist-linux/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.js 2>/dev/null || true
          sed -i 's/VSCodium Announcements/Astrolabe Announcements/g' dist-linux/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.js 2>/dev/null || true

          # Generate astrolabe.desktop file for Linux dock/taskbar integration
          printf "[Desktop Entry]\nName=Astrolabe IDE\nComment=The Sovereign AI-Native IDE\nGenericName=Text Editor\nExec=/usr/share/astrolabe/astrolabe %%F\nIcon=astrolabe\nType=Application\nStartupNotify=false\nStartupWMClass=astrolabe\nCategories=TextEditor;Development;IDE;\nMimeType=text/plain;inode/directory;\nActions=new-empty-window;\nKeywords=astrolabe;codium;vscode;ide;ai;\n\n[Desktop Action new-empty-window]\nName=New Empty Window\nExec=/usr/share/astrolabe/astrolabe --new-window %%F\nIcon=astrolabe\n" > dist-linux/astrolabe/astrolabe.desktop
          cp dist-linux/astrolabe/astrolabe.desktop dist-linux/astrolabe/resources/linux/code.desktop 2>/dev/null || true
          cp dist-linux/astrolabe/astrolabe.desktop dist-linux/astrolabe/resources/app/resources/linux/code.desktop 2>/dev/null || true

          cp README.md LICENSE build-all-astrolabe.sh install.sh dist-linux/astrolabe/
          
          # Create clean archive
          cd dist-linux
          tar -czf ../astrolabe-linux-x64.tar.gz astrolabe

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-linux-x64
          path: astrolabe-linux-x64.tar.gz

  # ============================================================================
  # 2. WINDOWS BUILD (Windows x64 zip / exe)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Vulkan SDK (Windows)
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanDir = Get-ChildItem -Path "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if ($vulkanDir) {
            echo "VULKAN_SDK=$($vulkanDir.FullName)" >> $env:GITHUB_ENV
            echo "$($vulkanDir.FullName)\Bin" >> $env:GITHUB_PATH
          }
        shell: powershell

      - name: Build Native AI Daemon (Windows MSVC)
        run: |
          cd daemon
          cargo build --release
        shell: bash

      - name: Build Exovon SDK
        run: |
          cd packages/exovon-sdk
          npm install --no-audit --no-fund
          npm run build
        shell: bash

      - name: Build Astrolabe Motion Studio
        run: |
          cd apps/astrolabe-motion-studio
          npm install --no-audit --no-fund
          npm run build
        shell: bash

      - name: Build ExovonHub Webview & Extension
        run: |
          cd src/stable/extensions/exovonhub/webview-ui
          npm install --no-audit --no-fund
          npm run build
          cd ..
          npm install --ignore-scripts --no-audit --no-fund
          npm run compile
        shell: bash

      - name: Package Complete Windows Distribution
        shell: bash
        run: |
          mkdir -p dist-win/astrolabe
          echo "==> Fetching base Windows Electron IDE..."
          LATEST_CODIUM=$(curl -sL "https://api.github.com/repos/VSCodium/vscodium/releases/latest" | grep -o 'https://github.com/VSCodium/vscodium/releases/download/[^"]*VSCodium-win32-x64-[^"]*\.zip' | head -n 1)
          curl -L "$LATEST_CODIUM" -o codium-win.zip
          7z x codium-win.zip -odist-win/astrolabe -y
          rm -f codium-win.zip
          
          if [ -f "dist-win/astrolabe/VSCodium.exe" ]; then
            mv dist-win/astrolabe/VSCodium.exe dist-win/astrolabe/astrolabe.exe
          fi
          if [ -f "dist-win/astrolabe/bin/codium.cmd" ]; then
            mv dist-win/astrolabe/bin/codium.cmd dist-win/astrolabe/bin/astrolabe.cmd
          fi
          
          # Inject native AI daemon (Windows) & DLLs
          mkdir -p dist-win/astrolabe/daemon dist-win/astrolabe/resources/app/daemon
          cp daemon/target/release/exovon-daemon.exe dist-win/astrolabe/daemon/ 2>/dev/null || true
          cp daemon/target/release/exovon-daemon.exe dist-win/astrolabe/resources/app/daemon/ 2>/dev/null || true
          cp daemon/target/release/*.dll dist-win/astrolabe/daemon/ 2>/dev/null || true
          cp daemon/target/release/*.dll dist-win/astrolabe/resources/app/daemon/ 2>/dev/null || true
          
          # Inject Astrolabe product branding
          cp product.json dist-win/astrolabe/resources/app/product.json
          
          # Brand resources/app/package.json name as astrolabe
          sed -i '0,/"name": "VSCodium"/{s/"name": "VSCodium"/"name": "astrolabe"/}' dist-win/astrolabe/resources/app/package.json
          
          # Clean node_modules symlinks that Windows cannot copy without Developer Mode
          rm -rf src/stable/extensions/exovonhub/node_modules/.bin
          rm -rf src/stable/extensions/exovonhub/node_modules/@exovon
          mkdir -p src/stable/extensions/exovonhub/node_modules/@exovon
          cp -r packages/exovon-sdk src/stable/extensions/exovonhub/node_modules/@exovon/sdk
          cp -r packages/exovon-core src/stable/extensions/exovonhub/node_modules/@exovon/core 2>/dev/null || true
          rm -rf src/stable/extensions/exovonhub/node_modules/@exovon/sdk/node_modules/.bin 2>/dev/null || true
          
          # Inject compiled ExovonHub extension (code + webview-ui + themes + media + node_modules)
          mkdir -p dist-win/astrolabe/resources/app/extensions/exovonhub/webview-ui
          cp -r src/stable/extensions/exovonhub/package.json dist-win/astrolabe/resources/app/extensions/exovonhub/
          cp -r src/stable/extensions/exovonhub/dist dist-win/astrolabe/resources/app/extensions/exovonhub/
          cp -r src/stable/extensions/exovonhub/webview-ui/dist dist-win/astrolabe/resources/app/extensions/exovonhub/webview-ui/
          cp -r src/stable/extensions/exovonhub/node_modules dist-win/astrolabe/resources/app/extensions/exovonhub/
          if [ -d "src/stable/extensions/exovonhub/themes" ]; then
            cp -r src/stable/extensions/exovonhub/themes dist-win/astrolabe/resources/app/extensions/exovonhub/
          fi
          if [ -d "src/stable/extensions/exovonhub/media" ]; then
            cp -r src/stable/extensions/exovonhub/media dist-win/astrolabe/resources/app/extensions/exovonhub/
          fi
          
          # Inject Motion Studio & icons & docs
          cp -r apps/astrolabe-motion-studio dist-win/astrolabe/
          cp -r icons dist-win/astrolabe/
          cp icons/stable/astrolabe.png dist-win/astrolabe/astrolabe.png
          cp README.md LICENSE dist-win/astrolabe/
          
          # Inject Astrolabe SVG icons & empty-screen watermarks into workbench
          python3 -c "
          import base64, os
          with open('icons/stable/astrolabe.png', 'rb') as f:
              b64 = base64.b64encode(f.read()).decode('ascii')
          icon_svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"100\" height=\"100\" viewBox=\"0 0 100 100\">
            <image width=\"100\" height=\"100\" xlink:href=\"data:image/png;base64,{b64}\"/>
          </svg>'''
          watermark_svg = f'''<svg xmlns=\"http://www.w3.org/2000/svg\" xmlns:xlink=\"http://www.w3.org/1999/xlink\" width=\"200\" height=\"200\" viewBox=\"0 0 200 200\" opacity=\"0.2\">
            <image width=\"200\" height=\"200\" xlink:href=\"data:image/png;base64,{b64}\"/>
          </svg>'''
          media_dir = 'dist-win/astrolabe/resources/app/out/media'
          if os.path.exists(media_dir):
              for name in ['code-icon.svg', 'vscode-icon.svg']:
                  with open(os.path.join(media_dir, name), 'w') as f:
                      f.write(icon_svg)
              for name in ['letterpress-dark.svg', 'letterpress-light.svg', 'letterpress-hcDark.svg', 'letterpress-hcLight.svg']:
                  with open(os.path.join(media_dir, name), 'w') as f:
                      f.write(watermark_svg)
          "

          # Inject Astrolabe Glass UI into workbench CSS
          if [ -f "dist-win/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.css" ]; then
            cat src/stable/src/vs/workbench/browser/media/astrolabe-glass.css >> dist-win/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.css
          fi
          
          # Brand desktopName and Walkthrough/Announcements text
          sed -i 's/"desktopName":"codium.desktop"/"desktopName":"astrolabe.desktop"/g' dist-win/astrolabe/resources/app/out/main.js 2>/dev/null || true
          if [ -f "dist-win/astrolabe/resources/app/out/nls.messages.json" ]; then
            sed -i 's/Get started with VSCodium/Get started with Astrolabe/g' dist-win/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/VSCodium Announcements/Astrolabe Announcements/g' dist-win/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/reloading VSCodium/reloading Astrolabe/g' dist-win/astrolabe/resources/app/out/nls.messages.json
            sed -i 's/Customize your editor, learn the basics, and start coding/Customize your AI workspace, explore agents, and start coding/g' dist-win/astrolabe/resources/app/out/nls.messages.json
          fi
          sed -i 's/Get started with VSCodium/Get started with Astrolabe/g' dist-win/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.js 2>/dev/null || true
          sed -i 's/VSCodium Announcements/Astrolabe Announcements/g' dist-win/astrolabe/resources/app/out/vs/workbench/workbench.desktop.main.js 2>/dev/null || true

          # Create real clean Windows zip archive
          cd dist-win
          7z a -tzip ../astrolabe-windows-x64.zip astrolabe
          cd ..

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astrolabe-windows-x64
          path: astrolabe-windows-x64.zip

  # ============================================================================
  # 3. PUBLISH GITHUB RELEASE
  # ============================================================================
  publish-release:
    name: Publish Release Packages
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Astrolabe ${{ github.event.inputs.release_tag || github.ref_name }}
          body: |
            # 🚀 Astrolabe All-In-One Open Source Release

            ### Standalone Distribution Downloads:
            * **🐧 Linux (Ubuntu / Debian / Arch / CachyOS x64)**: `astrolabe-linux-x64.tar.gz`
            * **🪟 Windows (x64 Standalone Zip)**: `astrolabe-windows-x64.zip`

            ---
            * **Native AI Engine**: Embedded Rust daemon with Vulkan, SGLang, and CPU fallback.
            * **Frosted Glass UI**: Clean dark glass aesthetic with subtle ambient radial glow.
            * **Motion Studio**: Visual UI and timeline animation studio.
            * **ExovonHub Agent**: Autonomous multi-file AI coding assistant and local model hub.
            * **Machine HealthGuard**: Built-in thermal monitoring and OOM hardware protection.
          files: |
            **/*.tar.gz
            **/*.zip
